name: capstone-nlp
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy>=1.26
  - pandas>=2.2
  - scikit-learn>=1.4
  - scipy>=1.13
  - matplotlib>=3.8
  - seaborn>=0.13
  - jupyter
  - jupyterlab
  - ipykernel
  - nbconvert
  - pip:
    - sentence-transformers>=2.7
    - transformers>=4.40
    - torch>=2.2
    - umap-learn>=0.5.6
    - hdbscan>=0.8.33
    - presidio-analyzer>=2.2
    - presidio-anonymizer>=2.2
    - spacy>=3.7
    - python-dotenv>=1.0
    - prophet>=1.1.5
    - statsmodels>=0.14
    - pmdarima>=2.0
    - plotly>=5.20
    - joblib>=1.3
    - tqdm>=4.66
    - pyarrow>=15.0
    - langdetect>=1.0.9
    - google-cloud-bigquery>=3.20
    - google-cloud-bigquery-storage>=2.25
    - google-cloud-storage>=2.16
    - db-dtypes>=1.2
